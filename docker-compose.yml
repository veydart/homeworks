services:
  citus-coordinator:
    image: citusdata/citus:12.1
    container_name: citus-coordinator
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: social_network
    ports:
      - "5432:5432"
    volumes:
      - citus-coordinator-data:/var/lib/postgresql/data
      - ./docker/citus/init-coordinator.sh:/docker-entrypoint-initdb.d/init-coordinator.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  citus-worker-1:
    image: citusdata/citus:12.1
    container_name: citus-worker-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: social_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - citus-worker1-data:/var/lib/postgresql/data
      - ./docker/citus/init-worker.sh:/docker-entrypoint-initdb.d/init-worker.sh

  citus-worker-2:
    image: citusdata/citus:12.1
    container_name: citus-worker-2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: social_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - citus-worker2-data:/var/lib/postgresql/data
      - ./docker/citus/init-worker.sh:/docker-entrypoint-initdb.d/init-worker.sh

  citus-manager:
    image: citusdata/citus:12.1
    container_name: citus-manager
    depends_on:
      citus-coordinator:
        condition: service_healthy
      citus-worker-1:
        condition: service_healthy
      citus-worker-2:
        condition: service_healthy
    environment:
      PGPASSWORD: root
    entrypoint: ["bash", "-c", "
      psql -h citus-coordinator -U postgres -d social_network -c \"SELECT citus_add_node('citus-worker-1', 5432);\" &&
      psql -h citus-coordinator -U postgres -d social_network -c \"SELECT citus_add_node('citus-worker-2', 5432);\" &&
      echo 'Citus workers added!' &&
      psql -h citus-coordinator -U postgres -d social_network -c \"SELECT * FROM citus_get_active_worker_nodes();\" &&
      echo 'Done. Exiting.'
    "]

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  citus-coordinator-data:
  citus-worker1-data:
  citus-worker2-data:
  redis-data:
